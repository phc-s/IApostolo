<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tor-ai-h</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(105deg, #000000, #162447, #9c7c38);
            --chat-bg: rgba(255, 255, 255, 0.05);
            --chat-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --user-bubble: #0f4c81;
            --ai-bubble: rgba(255, 255, 255, 0.1);
            --accent-color: #927d45;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 90vh;
            background: var(--chat-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--chat-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .chat-header {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--chat-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .save-btn {
            background: transparent;
            border: 1px solid var(--chat-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .save-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user {
            background: var(--user-bubble);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            background: var(--ai-bubble);
            border: 1px solid var(--chat-border);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--chat-border);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--chat-border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .chat-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .chat-input-area button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .chat-input-area button:hover {
            opacity: 0.9;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            .chat-container {
                height: 100vh;
                height: 100dvh;
                max-height: none;
                border-radius: 0;
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h1>IApostolo🕊️📖</h1>
            <button class="save-btn" id="saveBtn">Salvar Chat</button>
        </div>

        <!-- Chat History Area -->
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">Olá, seu microagente de IA. Pergunte-me qualquer coisa sobre seu documento PDF assim que estivermos conectados!</div>
        </div>

        <!-- Input Bar -->
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type your prompt here..." autocomplete="off">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const saveBtn = document.getElementById('saveBtn');

        // Function to append a message to the chat
        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll to bottom
        }

        // Handle sending message
        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

                appendMessage(text, 'user');
                userInput.value = '';

            try {
                 
                const response = await fetch('https://your-backend-url.onrender.com/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
        });
                const data = await response.json();
                appendMessage(data.response, 'ai');
    } catch (error) {
            appendMessage("Error connecting to AI agent backend.", 'ai');
    }
}

        // Event listeners
        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSend();
            }
        });

        // Save Chat functionality (downloads chat history as a text file)
        saveBtn.addEventListener('click', () => {
            const messages = document.querySelectorAll('.message');
            let chatText = "--- MICRO AI AGENT CHAT LOG ---\n\n";
            
            messages.forEach(msg => {
                const role = msg.classList.contains('user') ? 'User' : 'AI Agent';
                chatText += `${role}: ${msg.textContent}\n\n`;
            });

            const blob = new Blob([chatText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat-history-${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
